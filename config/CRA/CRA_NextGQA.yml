dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # Original CRA settings are kept unchanged for controlled
  # comparison with CRA and previous Q-Bound versions.
  #
  # IMPORTANT V1.10.1:
  #   window_sizes remains [1,3,5] ONLY for:
  #     (1) the original CRA grounding path, and
  #     (2) controlled fixed-window diagnostics.
  #
  #   The MAIN Q-Bound V1.10.1 interval does NOT come from the
  #   fixed-window search. It is produced by boundary-anchored
  #   posterior-guided refinement followed by posterior-stable
  #   reliability calibration.
  #
  # causal_feature_path + do:true still belong to the downstream
  # CRA testbed. They are not inputs to Q-Bound DECOMPOSE,
  # RELATE, COMPOSE, REFINE, or reliability calibration.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.10.1
  #
  #   DECOMPOSE -> RELATE -> COMPOSE
  #             -> DETACHED COMPOSER POSTERIOR
  #             -> BOUNDARY-ANCHORED POSTERIOR-GUIDED REFINE
  #             -> POSTERIOR-STABLE RELIABILITY CALIBRATION
  #             -> GROUND
  #
  # Failure diagnosed in V1.9:
  #   * Composer event-span posterior remained reasonably healthy,
  #     but its frame-pair prior was highly diffuse.
  #   * REFINE then sharpened very aggressively and converged to
  #     answer-discriminative interior micro-spans.
  #   * RAW hard span collapsed to roughly 1-2 frames and RAW
  #     expected span to only a few frames.
  #   * semantic retention collapsed and RAW IoU approached zero.
  #   * PSRC correctly reduced reliability and preserved MAIN IoU,
  #     but MAIN then stayed too close to coarse Composer evidence,
  #     limiting IoP / TIoP@0.5 / Acc&GQA.
  #
  # V1.10.1 changes ONLY the Composer->Refiner pair geometry:
  #   * keep the soft multi-candidate Composer posterior;
  #   * keep the routing posterior detached;
  #   * keep PSRC unchanged;
  #   * bias start probability toward the LEFT boundary of each
  #     candidate's first event;
  #   * bias end probability toward the RIGHT boundary of each
  #     candidate's last event;
  #   * do NOT impose a target span length or minimum duration.
  #
  # Controlled V1.10.1 objective remains:
  #   L = L_CRA/main + 0.10 L_align + 0.10 L_decomp
  #
  # CRA answer machinery, VisualIntervention, smoothing, and all
  # task/loss settings are intentionally unchanged. CRA ablations
  # start only in later V1.10.x variants.
  # ============================================================
  qbound:
    enabled: true
    version: "1.10.1"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only.
    # Actual event count remains dynamically selected:
    #   1 <= M <= max_events
    max_events: 4

    # Q-Bound temporal reasoning uses question-only semantics.
    # Candidate-answer semantics must not define topology,
    # event chains, or fine boundaries.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Controlled setting retained from V1.9.
    # Q-Bound learns its own parameters while raw video/question
    # inputs are detached from the upstream backbone via this path.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    # Unchanged to isolate the V1.10.1 Refiner-geometry change.
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true

      # total_loss += loss_weight * L_decomp
      loss_weight: 0.10

      # Internal partition-energy terms remain unchanged.
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    # Scorer and temperature stay unchanged from V1.9.
    #
    # V1.10.1 preserves:
    #   * differentiable Composer posterior/support for MAIN;
    #   * hard top-1 Composer readout only as a diagnostic branch;
    #   * detached multi-candidate posterior on the REFINE route.
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # REFINE:
    # Boundary-Anchored Posterior-Guided Refinement (BAPGR)
    # + Posterior-Stable Reliability Calibration (PSRC)
    # ----------------------------------------------------------
    refinement:
      enabled: true
      type: boundary_anchored_posterior_guided_reliability_refiner

      # Keep Refiner temperature unchanged for a clean V1.9 ->
      # V1.10.1 comparison.
      temperature: 0.30

      # V1.10.1 BAPGR geometry.
      #
      # power = 1.0 : mild endpoint anchoring
      # power = 2.0 : controlled first V1.10.1 run
      # larger      : stronger endpoint anchoring
      #
      # This is a structural prior, NOT a span-length loss.
      boundary_anchor_power: 2.0

      # Routing contract.
      hard_coarse_route: false
      detach_coarse: true
      posterior_guided: true
      posterior_stable_reliability: true
      boundary_structured: true

      # No V1.7/V1.8 auxiliary routing losses or learned gate.
      # Reliability remains parameter-free and detached.

    # ----------------------------------------------------------
    # Weak semantic alignment inherited from V1.2+
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # Deliberately NOT introduced in the first V1.10.1 run
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   supervised start/end loss
    #   direct span-length target
    #   minimum-span constraint
    #   minimal-sufficient loss
    #   coarse-answer auxiliary loss
    #   trim target
    #   IoU / IoP optimization loss
    #   Refiner entropy loss
    #   Composer entropy loss
    #   Composer length/diversity/balance loss
    #   event-count forcing
    #   CRA -> Q-Bound handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #   differentiable all-span REFINE marginalization
    #
    # First-run goal:
    #   1) remove V1.9 RAW micro-span collapse;
    #   2) increase RAW temporal completeness / semantic retention;
    #   3) allow PSRC reliability to rise naturally only when
    #      refinement becomes genuinely useful;
    #   4) improve MAIN IoP / TIoP@0.5 / Acc&GQA while preserving
    #      the MAIN IoU coverage achieved by V1.9.

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  #
  # CRAPipeline V1.10.1 adds only:
  #   + weak_align_weight * L_align
  #   + decomposition.loss_weight * L_decomp
  #
  # No new V1.10.1 routing/reliability/span-length loss.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including Composer and REFINE,
  # use the dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  # Same budget as V1.9 for a controlled comparison.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start V1.10.1 from scratch.
  # Pair-prior geometry differs from V1.9, so resuming a V1.9
  # checkpoint would not be a clean controlled experiment.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.10.1_seed2024
  info: "CRA testbed + Q-Bound V1.10.1 | dynamic latent decomposition + ordered event reasoning + latent contiguous event-span composition + boundary-anchored posterior-guided refinement (BAPGR) + posterior-stable reliability calibration (PSRC) + grounding"
  cuda: "0"
  seed: 2024
