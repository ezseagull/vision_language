dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # Original CRA settings are kept unchanged for controlled
  # comparison with CRA / Q-Bound V1.4.
  #
  # IMPORTANT V1.5:
  #   window_sizes remains [1,3,5] ONLY for:
  #     (1) the original CRA grounding path, and
  #     (2) detached legacy fixed-window diagnostics.
  #
  #   The MAIN Q-Bound V1.5 pre-hoc span no longer uses this
  #   fixed-window search. It comes from the adaptive event-span
  #   composer.
  #
  # causal_feature_path + do:true still belong to the downstream
  # CRA testbed. They are not inputs to Q-Bound decomposition,
  # Q-OEI, or span composition.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.5
  #
  #   DECOMPOSE -> RELATE -> COMPOSE -> GROUND
  #
  # V1.5 deliberately keeps the healthy V1.4 decomposition and
  # Q-OEI mechanisms, and replaces the legacy single-short-span
  # grounding bottleneck with a latent contiguous event-span
  # composer.
  # ============================================================
  qbound:
    enabled: true
    version: "1.5"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only.
    # Actual event count is still selected dynamically:
    #     1 <= M <= max_events
    max_events: 4

    # Decomposition, Q-OEI, and COMPOSE use question-only
    # semantics. Candidate-answer semantics must not define
    # temporal topology or latent support.
    require_question_only: true

    # CRA temporal key/prior is not consumed by the Q-Bound core.
    use_temporal_prior: false

    # Keep the same controlled setting as V1.4.
    # Q-Bound learns its own parameters without sending gradients
    # through its raw video/question input path into the upstream
    # backbone encoders.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    # Keep V1.4 values unchanged in the first V1.5 run so any
    # improvement can be attributed primarily to COMPOSE.
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true

      # Outer objective:
      # total_loss += loss_weight * L_decomp
      loss_weight: 0.10

      # Internal partition-energy terms.
      # Deliberately unchanged from V1.4.
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    # For M valid ordered events, the composer considers every
    # contiguous event chain:
    #   [E1], [E2], ..., [E1,E2], [E2,E3], ...
    #
    # With max_events=4 there are at most 10 candidate chains,
    # so this remains lightweight.
    #
    # Training uses the soft span posterior to build the temporal
    # support. The hard top-1 event chain is used for adaptive
    # start/end diagnostics/evaluation and future LLM token export.
    composer:
      enabled: true
      type: latent_contiguous_event_span

      # Initial softmax temperature for the span posterior.
      # This is the only new V1.5 hyperparameter in the first run.
      temperature: 0.35

    # ----------------------------------------------------------
    # Weak semantic alignment inherited from V1.2/V1.4
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # Deliberately NOT introduced in first V1.5 run
    # ----------------------------------------------------------
    # No:
    #   composer/span supervision from temporal GT
    #   composer entropy loss
    #   composer length loss
    #   composer sparsity/diversity/balance loss
    #   CRA -> Q-Bound handover
    #   direct reasoned-event -> answer residual
    #   boundary-sparsity loss
    #   event-balance/diversity loss
    #   CRA consistency loss
    #
    # Goal of the first V1.5 run:
    # isolate whether adaptive event-span composition fixes the
    # V1.4 grounding-readout bottleneck.

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  # CRAPipeline V1.5 still adds only:
  #   + weak_align_weight * L_align
  #   + decomposition.loss_weight * L_decomp
  #
  # There is NO separate composer loss in the first V1.5 run.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including the new composer,
  # are expected to use this Q-Bound optimizer group.
  qbound_lr: 5.e-5

  # Keep the same exploratory budget for a controlled comparison.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # First controlled V1.5 run starts without resuming V1.4.
  # This avoids partial-checkpoint ambiguity from the new composer
  # parameters. A later warm-start ablation can be done separately.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.5_seed2024
  info: "CRA testbed + Q-Bound V1.5 | dynamic latent decomposition + ordered event reasoning + latent contiguous event-span composition + adaptive grounding"
  cuda: "0"
  seed: 2024
