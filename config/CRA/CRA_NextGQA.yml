# Q-Bound V3.8-M2: frozen M1 C2/C4 evaluation (infer only).
# Keep CRA QA and the M1 checkpoint architecture unchanged.
# Seconds utility is the main result; step utility replays the locked reference.
# GQA temporal annotations are evaluator-only. No scorer is trained here.
#
# Keep this as a separate config from the M1 training YAML.

dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null
  # Grouped TRAIN only: at most 16 videos x 4 questions, no repeats or drops.
  batch_size: 64
  m1_grouped_batch: true
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL
model:
  name: CRA
  baseline: refine
  lan: RoBERTa
  lan_weight_path: roberta-base
  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265
  n_negs: 1
  prop_num: 1
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes:
  - 1
  - 3
  - 5
  time_penalty: null
  do: false
  vg_loss: 1
  vote: 0
  qbound:
    enabled: true
    version: "3.8-m1"
    # Diagnostic WHERE overlay. Not part of the M1 checkpoint architecture.
    m2_mbr:
      enabled: true
      references: true
      compare_steps: true
      learned: false
    # Fresh training: use corrected padding-masked learned-attention pooling.
    # This refers to m_cra/only_trans.py, NOT m_tempclip/language_model.py.
    language_pooling_mode: masked
    require_question_only: true
    require_token_question: true
    detach_backbone_inputs: true
    hidden_dim: 256
    dropout: 0.3
    num_question_heads: 4
    question_ff_multiplier: 2
    grounding_loss:
      enabled: true
      loss_weight: 1.0
      temperature: 0.07
    predictive_loss:
      enabled: false
      loss_weight: 0.0
    support_graph_mode: fixed
    # R2-C: no predictor parameters/forward; fixed graph stays unchanged.
    support_predictor_enabled: false
    # No V3.5 Q2 objective. Same-video competition belongs to M1 L_Q only.
    pair_loss:
      enabled: false
      loss_weight: 0.0
      temperature: 0.07
      margin: 0.0
      gradient_audit_every: 0
    # M1: framewise cosine with fixed uniform inside / inside-minus-ring readout.
    # The question and answer MIL objectives are separate. No M0 joint softmax.
    v38:
      widths: [2, 4, 8, 16]
      prior_mode: scale_balanced
      include_tail: true
      detach_answer_embeddings: true
      projection_dim: 256
      gamma: 0.25
      window_temperature: 0.1
      candidate_temperature: 0.1
      question_loss_weight: 1.0
      answer_loss_weight: 1.0
      gradient_audit_every: 100
optim:
  pipeline: cra
  optimizer: Adam
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5
  clip: 12
  lr: 1.0e-05
  weight_decay: 0
  amsgrad: true
  qbound_lr: 5.0e-05
  # Separate LR for the trainable M1 scorer only. The bank reader is frozen.
  qbound_v38_lr: 5.0e-05
  qbound_v38_weight_decay: 0.0
  epochs: 15
  save_period: 1
  # Linear warmup for one epoch, then cosine on actual grouped train batches.
  lr_scheduler: warmup
  step_size: 1
  # Full official training: no planned early pause at epoch 10.
  stop_after_epoch: 15
stat:
  monitor:
    mode: max
    # CRA answer + M1 WHERE conditioned on the answer predicted by CRA.
    metric: v38_m1_cra_acc_gqa
    early_stop: 15
    vis: false
    display_port: 8099
  record_dir: ./output
  # Same checkpoint path used by the previous M1 audit. Point this at the
  # exact epoch-15 weights if comparing to val_epoch_15.
  # This is weights-only evaluation. Use infer(), not train() or resume.
  m2_eval_checkpoint: null
  init_from_checkpoint: null
  resume: null
  resume_strict: true
  resume_optimizer_strict: true
  save_val_predictions: true
  # Test is LOGGING-ONLY and NEVER used for checkpoint/model selection.
  eval_test_each_epoch: true
  save_epoch_weights: false
misc:
  running_name: CRA/NextGQA/QBound_V3_8_M2_MBR_C2C4_eval_seed2024
  info: >-
    Q-Bound V3.8-M2 frozen M1 evaluation for NextGQA CLIPL_I, 32 steps
    and 5 choices. CRA predicts the answer on the full video. C2/C4
    use the same 496 intervals and MBR decoder, with seconds utility
    primary and step utility for locked replay. No learned scorer,
    optimizer update, or checkpoint selection in this evaluation.
  cuda: '0'
  seed: 2024
