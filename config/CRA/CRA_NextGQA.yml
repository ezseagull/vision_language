dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # Q-Bound V1.1.
  # Defaults for temperatures / merge / split remain inside QBoundCore.
  qbound:
    enabled: true
    version: "1.1"
    hidden_dim: 256
    max_events: 4

    # Main V1.1 run: do not feed CRA grounding back into Q-Bound.
    # This prevents the event topology from learning to copy CRA key.
    use_temporal_prior: false

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives stay unchanged.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # Only three new optimization hyperparameters in V1.1.
  qbound_lr: 5.e-5
  qbound_weight: 0.02
  # qbound_structural_weight: 0.10
  # qbound_minimality_weight: 0.01

  epochs: 30
  save_period: 1
  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 30
    vis: false
    display_port: 8099
  record_dir: ./output
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.2_seed2024
  info: "CRA + Q-Bound V1.2"
  cuda: "0"
  seed: 2024
