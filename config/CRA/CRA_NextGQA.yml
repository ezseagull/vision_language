dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # Original CRA settings are kept unchanged for controlled
  # comparison with CRA and previous Q-Bound versions.
  #
  # IMPORTANT V1.9:
  #   window_sizes remains [1,3,5] ONLY for:
  #     (1) the original CRA grounding path, and
  #     (2) controlled fixed-window diagnostics.
  #
  #   The MAIN Q-Bound V1.9 interval does NOT come from the
  #   fixed-window search. It is produced by posterior-guided
  #   refinement followed by posterior-stable reliability
  #   calibration.
  #
  # causal_feature_path + do:true still belong to the downstream
  # CRA testbed. They are not inputs to Q-Bound DECOMPOSE,
  # RELATE, COMPOSE, REFINE, or reliability calibration.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.9
  #
  #   DECOMPOSE -> RELATE -> COMPOSE
  #             -> DETACHED POSTERIOR-GUIDED REFINE
  #             -> POSTERIOR-STABLE RELIABILITY CALIBRATION
  #             -> GROUND
  #
  # Root cause addressed from V1.8:
  #   * Composer soft posterior could remain uncertain while a
  #     hard top-1 route switched abruptly to a single-event chain.
  #   * That hard route shrank the Refiner search domain.
  #   * Pair entropy then decreased partly because the search
  #     domain became easier/smaller, not because boundaries were
  #     necessarily more correct.
  #   * V1.8 interpreted that concentration as reliability and
  #     over-trusted raw refinement.
  #
  # V1.9 changes:
  #   * no hard top-1 Composer route is used by REFINE;
  #   * the detached Composer posterior defines a boundary-pair
  #     prior over all valid contiguous event-span candidates;
  #   * Refiner updates that prior without sending gradients back
  #     through the routing prior to Composer;
  #   * reliability combines Refiner concentration, relative
  #     information gain, and retained coarse semantic evidence;
  #   * MAIN remains a calibrated coarse/fine temporal branch.
  #
  # Controlled first V1.9 objective remains:
  #   L = L_CRA/main + 0.10 L_align + 0.10 L_decomp
  # ============================================================
  qbound:
    enabled: true
    version: "1.9"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only.
    # Actual event count remains dynamically selected:
    #   1 <= M <= max_events
    max_events: 4

    # Q-Bound temporal reasoning uses question-only semantics.
    # Candidate-answer semantics must not define topology,
    # event chains, or fine boundaries.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Controlled setting retained from V1.8.
    # Q-Bound learns its own parameters while raw video/question
    # inputs are detached from the upstream backbone via this path.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    # Unchanged to isolate the V1.9 routing/reliability mechanism.
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true

      # total_loss += loss_weight * L_decomp
      loss_weight: 0.10

      # Internal partition-energy terms remain unchanged.
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    # Scorer and temperature stay unchanged.
    #
    # V1.9 preserves:
    #   * differentiable Composer posterior/support for MAIN;
    #   * hard top-1 Composer readout only as a diagnostic branch.
    #
    # V1.9 changes the interface to REFINE:
    #   * Composer posterior is detached;
    #   * all valid Composer candidates contribute to a single
    #     boundary-pair prior;
    #   * no hard top-1 route is fed into REFINE.
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # REFINE: Detached Posterior-Guided Refinement (DPGR)
    # + Posterior-Stable Reliability Calibration (PSRC)
    # ----------------------------------------------------------
    refinement:
      enabled: true
      type: posterior_guided_reliability_refiner

      # Keep the Refiner temperature unchanged for controlled
      # comparison with V1.8.
      temperature: 0.30

      # V1.9 routing contract.
      #
      # These fields document the intended experiment. The V1.9
      # core/decoder also enforce the contract through runtime flags.
      hard_coarse_route: false
      detach_coarse: true
      posterior_guided: true
      posterior_stable_reliability: true

      # No V1.7/V1.8 auxiliary routing losses or learned gate.
      # Reliability is parameter-free in the first controlled V1.9 run.

    # ----------------------------------------------------------
    # Weak semantic alignment inherited from V1.2+
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # Deliberately NOT introduced in the first V1.9 run
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   supervised start/end loss
    #   direct span-length target
    #   minimal-sufficient loss
    #   coarse-answer auxiliary loss
    #   trim target
    #   IoU / IoP optimization loss
    #   Refiner entropy loss
    #   Composer entropy loss
    #   Composer length/diversity/balance loss
    #   event-count forcing
    #   CRA -> Q-Bound handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #   differentiable all-span REFINE marginalization
    #
    # First-run goal:
    # remove hard-routing instability and prevent sharp-but-wrong
    # fine localization from receiving excessive trust, while
    # preserving the strong temporal coverage achieved by V1.8.

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  #
  # CRAPipeline V1.9 adds only:
  #   + weak_align_weight * L_align
  #   + decomposition.loss_weight * L_decomp
  #
  # No new V1.9 reliability/routing loss is introduced.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including Composer and REFINE,
  # use the dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  # Same budget as V1.8 for a controlled comparison.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start V1.9 from scratch.
  # Routing and reliability semantics differ from V1.8, so resuming
  # a V1.8 checkpoint would not be a clean controlled experiment.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.9_seed2024
  info: "CRA testbed + Q-Bound V1.9 | dynamic latent decomposition + ordered event reasoning + latent contiguous event-span composition + detached posterior-guided refinement + posterior-stable reliability calibration + grounding"
  cuda: "0"
  seed: 2024
