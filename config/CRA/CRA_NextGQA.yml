dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # Original CRA settings are kept unchanged for controlled
  # comparison with CRA and Q-Bound V1.4/V1.5/V1.6/V1.7.
  #
  # IMPORTANT V1.8:
  #   window_sizes remains [1,3,5] ONLY for:
  #     (1) the original CRA grounding path, and
  #     (2) controlled fixed-window diagnostics.
  #
  #   The MAIN Q-Bound V1.8 pre-hoc interval does NOT come from
  #   the fixed-window search. It uses the uncertainty-calibrated
  #   coarse-to-fine interval produced by Q-Bound.
  #
  # causal_feature_path + do:true still belong to the downstream
  # CRA testbed. They are not inputs to Q-Bound DECOMPOSE,
  # RELATE, COMPOSE, REFINE, or uncertainty calibration.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.8
  #
  #   DECOMPOSE -> RELATE -> COMPOSE -> REFINE
  #             -> UNCERTAINTY CALIBRATION -> GROUND
  #
  # V1.8 keeps the healthy DECOMPOSE, Q-OEI, Composer scorer,
  # and frame-level Refiner architecture from previous versions.
  #
  # Main method change:
  #   * REFINE still receives only the detached hard top-1
  #     coarse event chain;
  #   * raw REFINE is treated as a fine-grained proposal;
  #   * the MAIN temporal probability is calibrated between
  #     coarse COMPOSE support and raw REFINE support according
  #     to the Refiner pair-posterior uncertainty;
  #   * V1.7 coarse-task and minimal-sufficient losses are removed.
  #
  # Controlled first V1.8 objective:
  #   L = L_CRA/main + 0.10 L_align + 0.10 L_decomp
  # ============================================================
  qbound:
    enabled: true
    version: "1.8"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only.
    # Actual event count remains dynamically selected:
    #   1 <= M <= max_events
    max_events: 4

    # All Q-Bound temporal reasoning uses question-only semantics.
    # Candidate-answer semantics must not define topology,
    # event chains, or fine boundaries.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Same controlled setting as previous versions.
    # Q-Bound learns its own parameters while raw video/question
    # inputs are detached from the upstream backbone via this path.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    # Unchanged to isolate the V1.8 fusion/routing mechanism.
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true

      # total_loss += loss_weight * L_decomp
      loss_weight: 0.10

      # Internal partition-energy terms: unchanged.
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    # Scorer and temperature are unchanged for a controlled run.
    # For M ordered events, all valid contiguous chains [Ei ... Ej]
    # are considered; with max_events=4 there are at most 10.
    #
    # In V1.8:
    #   * composed_temporal_prob stays differentiable;
    #   * it contributes directly to the calibrated MAIN probability;
    #   * only detached top-1 coarse chain is routed into REFINE.
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # REFINE + UNCERTAINTY CALIBRATION
    # ----------------------------------------------------------
    # Given detached selected coarse chain [Ei ... Ej]:
    #   start is searched only inside Ei,
    #   end   is searched only inside Ej,
    #   start <= end,
    #   raw refined interval stays inside the coarse chain.
    #
    # V1.8 does NOT optimize "shorter is better".
    # The raw Refiner proposal is trusted according to its own
    # pair-posterior uncertainty, while uncertain predictions
    # preserve more coarse semantic coverage.
    refinement:
      enabled: true
      type: uncertainty_calibrated_boundary_refiner

      # Keep V1.6/V1.7 temperature unchanged for isolation.
      temperature: 0.30

      # Routing contract.
      hard_coarse_route: true
      detach_coarse: true

      # No V1.7:
      #   coarse_task_weight
      #   minimal_sufficient_weight
      #   sufficiency_margin
      #
      # Calibration is parameter-free in the current V1.8 core
      # and does not introduce a new trainable gate or loss.

    # ----------------------------------------------------------
    # Weak semantic alignment inherited from V1.2+
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # Deliberately NOT introduced in the first V1.8 run
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   supervised start/end loss
    #   direct span-length target
    #   minimal-sufficient loss
    #   coarse-answer auxiliary loss
    #   trim target
    #   IoU / IoP optimization loss
    #   Refiner entropy loss
    #   Composer entropy loss
    #   Composer length/diversity/balance loss
    #   event-count forcing
    #   CRA -> Q-Bound handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #
    # Goal:
    # preserve coarse temporal coverage when REFINE is uncertain,
    # while retaining fine localization precision when REFINE is confident.

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  #
  # CRAPipeline V1.8 adds only:
  #   + weak_align_weight * L_align
  #   + decomposition.loss_weight * L_decomp
  #
  # There is NO V1.7 coarse-task or minimal-sufficient loss.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including Composer and REFINE,
  # use the dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  # Same training budget for controlled comparison.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start V1.8 from scratch.
  # V1.8 changes the COMPOSE/REFINE fusion and removes the V1.7
  # auxiliary objectives, so resuming V1.7 is not controlled.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.8_seed2024
  info: "CRA testbed + Q-Bound V1.8 | dynamic latent decomposition + ordered event reasoning + latent contiguous event-span composition + detached hard coarse routing + uncertainty-calibrated frame-level refinement + grounding"
  cuda: "0"
  seed: 2024
