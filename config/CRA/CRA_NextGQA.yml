dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # CRA remains only the downstream VideoQA testbed/consumer.
  #
  # V1.11-A controlled change:
  #   * VisualIntervention remains OFF, following the V1.10.3 ablation.
  #   * CRA still keeps its own VideoEmbedding and downstream x_bar.
  #   * Q-Bound no longer consumes CRA.VideoEmbedding output.
  #   * Q-Bound receives the sampled raw CLIP-L feature tensor directly
  #     and applies its own trainable generic input adapter.
  #
  # window_sizes remains [1,3,5] only for the original CRA path and
  # controlled grounding/readout diagnostics. The official Q-Bound MAIN
  # interval is still produced by COMPOSE + BAPGR + PPBR + PSRC.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  # V1.10.3 showed no material loss from disabling CRA VisualIntervention
  # and healthier Q-Bound internal dynamics, so keep it OFF in V1.11.
  do: false

  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.11-A — GENERIC INPUT DECOUPLING
  #
  # Data route:
  #
  #   sampled raw CLIP-L [B,T,768]
  #          |                         |
  #          |                         +--> CRA.VideoEmbedding --> CRA consumer
  #          |
  #          +--> Q-Bound-owned generic input adapter
  #                    |
  #                    v
  #              DECOMPOSE -> RELATE -> COMPOSE
  #                    -> detached Composer posterior
  #                    -> BAPGR
  #                    -> PPBR
  #                    -> PSRC
  #                    -> GROUND
  #
  # The principal V1.11-A mechanism change is ONLY the input contract:
  #
  #   V1.10.3:
  #     raw CLIP-L -> CRA.VideoEmbedding -> Q-Bound
  #
  #   V1.11-A:
  #     raw CLIP-L -> Q-Bound-owned generic adapter -> Q-Bound
  #
  # CRA remains the downstream answer consumer for this version so that
  # the effect of input decoupling can be measured without simultaneously
  # replacing the answer head/output adapter.
  #
  # The generic adapter is owned by QBoundCore and is initialized close
  # to the raw feature geometry (identity-initialized projection), then:
  #
  #     Linear(768->768)
  #       -> GELU
  #       -> LayerNorm
  #       -> fixed sinusoidal positional encoding
  #       -> Dropout
  #
  # V1.11-A preserves V1.10.3 temporal mechanisms unchanged:
  #   * dynamic DECOMPOSE
  #   * Q-OEI RELATE
  #   * latent contiguous COMPOSE
  #   * BAPGR boundary geometry
  #   * detached Composer -> Refiner routing
  #   * PPBR cap = 2.0
  #   * PSRC reliability calibration
  #   * no CRA temporal prior/handover
  #   * no direct event-token answer residual
  #
  # Training objective remains:
  #
  #   L = L_CRA/main + 0.10 L_align + 0.10 L_decomp
  #
  # CREDiT-inspired counterfactual evidence training is deliberately OFF
  # in V1.11-A. The first run isolates generic-input decoupling. A later
  # V1.11-B can enable the counterfactual interface/loss as a separate
  # ablation.
  #
  # No temporal GT, IoU/IoP loss, duration target, minimum-span rule,
  # minimality/sparsity loss, event-count forcing, or learned reliability
  # gate is introduced.
  # ============================================================
  qbound:
    enabled: true
    version: "1.11"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only; event count remains dynamic.
    max_events: 4

    # Q-Bound topology/reasoning uses question-only semantics.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Raw CLIP-L/question features are detached from external encoders via
    # this route; Q-Bound's own adapter/core parameters remain trainable.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # V1.11-A: Q-Bound-owned generic visual input adapter
    # ----------------------------------------------------------
    use_generic_input_adapter: true

    # Keep equal to Q-Bound dropout for the first controlled run.
    input_adapter_dropout: 0.3

    # Preserve explicit temporal order without using CRA.VideoEmbedding.
    input_adapter_use_position: true

    # OFF in V1.11-A. Enable only in the separate V1.11-B
    # counterfactual-evidence experiment.
    counterfactual_evidence_interface: false

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true
      loss_weight: 0.10
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # REFINE:
    # BAPGR + PPBR + PSRC
    # ----------------------------------------------------------
    refinement:
      enabled: true
      type: prior_preserving_bounded_refiner

      # Unchanged from V1.10.2/V1.10.3.
      temperature: 0.30
      boundary_anchor_power: 2.0
      correction_cap: 2.0

      # Routing contract.
      hard_coarse_route: false
      detach_coarse: true
      posterior_guided: true
      posterior_stable_reliability: true
      boundary_structured: true

    # ----------------------------------------------------------
    # Weak question/event semantic alignment
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # V1.11-A controlled exclusions
    # ----------------------------------------------------------
    # No:
    #   counterfactual answer loss (reserved for V1.11-B)
    #   temporal-GT supervision
    #   supervised start/end loss
    #   direct span-length target
    #   minimum-span constraint
    #   minimal-sufficient / sparsity loss
    #   coarse-answer auxiliary loss
    #   trim target
    #   IoU / IoP optimization loss
    #   Refiner entropy loss
    #   Composer entropy/diversity/balance loss
    #   event-count forcing
    #   CRA -> Q-Bound temporal handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #   differentiable all-span REFINE marginalization
    #
    # First-run goals:
    #   1) verify Q-Bound can learn from raw sampled CLIP-L features without
    #      consuming CRA.VideoEmbedding representations;
    #   2) preserve or improve mIoP / mIoU / TIoP@0.5 / Acc&GQA relative
    #      to V1.10.3;
    #   3) verify the generic adapter receives gradients and does not destroy
    #      CLIP geometry (token cosine / delta-ratio diagnostics);
    #   4) keep BAPGR/PPBR/PSRC dynamics healthy while reducing CRA-specific
    #      representation dependence;
    #   5) establish a clean baseline before V1.11-B counterfactual evidence
    #      training and V1.12 generic output/event adapter.

optim:
  pipeline: cra
  optimizer: Adam

  # Same controlled task objective as V1.10.3.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including the new generic input adapter,
  # Composer and Refiner, should use this dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start V1.11-A from scratch. The Q-Bound input distribution/adapter has
  # changed, so resuming a V1.10.x checkpoint would confound the ablation.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.11A_generic_input_seed2024
  info: "CRA downstream testbed + Q-Bound V1.11-A | raw CLIP-L -> Q-Bound-owned generic input adapter | VisualIntervention OFF | dynamic DECOMPOSE + Q-OEI + COMPOSE + BAPGR + PPBR(cap=2.0) + PSRC | counterfactual evidence training OFF"
  cuda: "0"
  seed: 2024
