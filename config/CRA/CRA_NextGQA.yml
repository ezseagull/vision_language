dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # Original CRA settings are kept unchanged for controlled
  # comparison with CRA / Q-Bound V1.4 / V1.5.
  #
  # IMPORTANT V1.6:
  #   window_sizes remains [1,3,5] ONLY for:
  #     (1) the original CRA grounding path, and
  #     (2) detached legacy fixed-window diagnostics.
  #
  #   The MAIN Q-Bound V1.6 pre-hoc span does NOT use this
  #   fixed-window search and does NOT use the coarse Composer
  #   event boundaries directly. It uses frame-level refined
  #   start/end predicted inside the selected coarse event chain.
  #
  # causal_feature_path + do:true still belong to the downstream
  # CRA testbed. They are not inputs to Q-Bound DECOMPOSE,
  # RELATE, COMPOSE, or REFINE.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.6
  #
  #   DECOMPOSE -> RELATE -> COMPOSE -> REFINE -> GROUND
  #
  # V1.6 deliberately keeps the healthy V1.5 DECOMPOSE,
  # Q-OEI, and Composer mechanisms unchanged. The only method
  # change in the first controlled V1.6 run is frame-level
  # boundary refinement inside the first/last selected events.
  # ============================================================
  qbound:
    enabled: true
    version: "1.6"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only.
    # Actual event count remains dynamically selected:
    #     1 <= M <= max_events
    max_events: 4

    # All Q-Bound temporal reasoning stages use question-only
    # semantics. Candidate-answer semantics must never define
    # topology, event chains, or refined boundaries.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Keep the same controlled setting as V1.5.
    # Q-Bound learns its own parameters while its raw video and
    # question inputs are detached from the upstream backbone.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    # Unchanged from V1.4/V1.5.
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    # Keep all topology-related values unchanged so the first
    # V1.6 experiment isolates the effect of REFINE.
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true

      # Outer objective:
      # total_loss += loss_weight * L_decomp
      loss_weight: 0.10

      # Internal partition-energy terms.
      # Deliberately unchanged from V1.4/V1.5.
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    # Unchanged from V1.5.
    #
    # For M ordered events, consider every valid contiguous event
    # chain [Ei ... Ej]. With max_events=4 there are at most
    # 10 candidates.
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # REFINE: Question-Conditioned Frame Boundary Refiner
    # ----------------------------------------------------------
    # NEW in V1.6.
    #
    # Given a coarse event chain [Ei ... Ej]:
    #   start is searched only inside Ei,
    #   end   is searched only inside Ej,
    #   start <= end,
    #   interior selected events remain covered.
    #
    # Training marginalizes the conditional frame-level
    # start/end posterior with the Composer span posterior.
    # Hard refined start/end are detached and used only for
    # evaluation/diagnostics.
    refinement:
      enabled: true
      type: question_conditioned_frame_boundary_refiner

      # First controlled V1.6 value.
      # Do not tune Composer temperature at the same time.
      temperature: 0.30

    # ----------------------------------------------------------
    # Weak semantic alignment inherited from V1.2+
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # Deliberately NOT introduced in the first V1.6 run
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   refiner/start-end supervised loss
    #   span-length loss
    #   trim loss
    #   IoU / IoP optimization loss
    #   Composer entropy loss
    #   Composer length/diversity/balance loss
    #   CRA -> Q-Bound handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #
    # Goal:
    # test whether frame-level refinement can recover temporal
    # precision (IoP/GQA) while preserving the coverage/IoU gain
    # introduced by V1.5 COMPOSE.

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  # CRAPipeline V1.6 still adds only:
  #   + weak_align_weight * L_align
  #   + decomposition.loss_weight * L_decomp
  #
  # REFINE has NO separate auxiliary loss in the first V1.6 run.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including the new frame
  # boundary refiner, use the dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  # Keep the same training budget for controlled comparison.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start the first V1.6 controlled run from scratch.
  # This avoids partial-checkpoint ambiguity because REFINE adds
  # new trainable parameters.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.6_seed2024
  info: "CRA testbed + Q-Bound V1.6 | dynamic latent decomposition + ordered event reasoning + latent event-span composition + question-conditioned frame-level boundary refinement + grounding"
  cuda: "0"
  seed: 2024
