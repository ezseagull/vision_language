dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # Original CRA settings are kept unchanged for controlled
  # comparison with CRA and previous Q-Bound versions.
  #
  # IMPORTANT V1.10.2:
  #   window_sizes remains [1,3,5] ONLY for:
  #     (1) the original CRA grounding path, and
  #     (2) controlled fixed-window diagnostics.
  #
  #   The MAIN Q-Bound V1.10.2 interval does NOT come from the
  #   fixed-window search. It is produced by boundary-anchored
  #   posterior-guided refinement followed by posterior-stable
  #   reliability calibration.
  #
  # causal_feature_path + do:true still belong to the downstream
  # CRA testbed. They are not inputs to Q-Bound DECOMPOSE,
  # RELATE, COMPOSE, REFINE, or reliability calibration.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.10.2
  #
  #   DECOMPOSE -> RELATE -> COMPOSE
  #             -> DETACHED COMPOSER POSTERIOR
  #             -> BOUNDARY-ANCHORED POSTERIOR-GUIDED PRIOR (BAPGR)
  #             -> PRIOR-PRESERVING BOUNDED REFINEMENT (PPBR)
  #             -> POSTERIOR-STABLE RELIABILITY CALIBRATION (PSRC)
  #             -> GROUND
  #
  # Failure diagnosed in V1.10.1:
  #   * BAPGR successfully changed the Composer pair prior:
  #       - fewer effective pairs,
  #       - stronger endpoint preference,
  #       - longer expected prior span.
  #   * Extreme V1.9 point-collapse was reduced, but the learned
  #     Refiner correction still became increasingly dominant.
  #   * RAW expected support contracted from broad BAPGR evidence
  #     to a much shorter answer-discriminative region.
  #   * semantic retention fell sharply while Refiner confidence
  #     and information gain increased.
  #   * PSRC correctly reduced reliability, so MAIN stayed close
  #     to Composer and IoP / Acc&GQA improved little.
  #
  # V1.10.2 changes ONLY the learned Refiner update:
  #
  #     delta     = pair_logits / temperature
  #     delta_hat = c * tanh(delta / c)
  #     p_refine  propto p_BAPGR * exp(delta_hat)
  #
  #   where c = correction_cap.
  #
  # This keeps the Refiner differentiable and able to re-rank
  # legal start/end pairs, but prevents its correction from
  # overriding the structural prior without bound.
  #
  # V1.10.2 preserves:
  #   * dynamic DECOMPOSE;
  #   * Q-OEI RELATE;
  #   * latent contiguous COMPOSE;
  #   * BAPGR boundary geometry;
  #   * detached Composer -> Refiner routing;
  #   * PSRC unchanged;
  #   * CRA answer machinery and VisualIntervention unchanged;
  #   * the same training objective and optimizer settings.
  #
  # Controlled V1.10.2 objective remains:
  #   L = L_CRA/main + 0.10 L_align + 0.10 L_decomp
  #
  # No temporal GT, target duration, minimum-span constraint,
  # IoU/IoP loss, minimality loss, entropy loss, or learned
  # reliability gate is introduced.
  # ============================================================
  qbound:
    enabled: true
    version: "1.10.2"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only.
    # Actual event count remains dynamically selected:
    #   1 <= M <= max_events
    max_events: 4

    # Q-Bound temporal reasoning uses question-only semantics.
    # Candidate-answer semantics must not define topology,
    # event chains, or fine boundaries.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Controlled setting retained from V1.9.
    # Q-Bound learns its own parameters while raw video/question
    # inputs are detached from the upstream backbone via this path.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    # Unchanged to isolate the V1.10.2 PPBR correction change.
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true

      # total_loss += loss_weight * L_decomp
      loss_weight: 0.10

      # Internal partition-energy terms remain unchanged.
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    # Scorer and temperature stay unchanged from V1.9.
    #
    # V1.10.2 preserves:
    #   * differentiable Composer posterior/support for MAIN;
    #   * hard top-1 Composer readout only as a diagnostic branch;
    #   * detached multi-candidate posterior on the REFINE route.
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # REFINE:
    # Boundary-Anchored Posterior-Guided Refinement (BAPGR)
    # + Prior-Preserving Bounded Refinement (PPBR)
    # + Posterior-Stable Reliability Calibration (PSRC)
    # ----------------------------------------------------------
    refinement:
      enabled: true
      type: prior_preserving_bounded_refiner

      # Keep Refiner temperature unchanged for a clean
      # V1.10.1 -> V1.10.2 comparison.
      temperature: 0.30

      # BAPGR geometry remains unchanged.
      #
      # power = 1.0 : mild endpoint anchoring
      # power = 2.0 : controlled V1.10.1/V1.10.2 setting
      # larger      : stronger endpoint anchoring
      #
      # This is a structural prior, NOT a span-length loss.
      boundary_anchor_power: 2.0

      # V1.10.2 PPBR trust-region cap.
      #
      # delta_hat = correction_cap * tanh(delta / correction_cap)
      #
      # First controlled run: c = 2.0.
      # This bounds the learned correction; it does NOT impose
      # a target duration or a minimum temporal span.
      correction_cap: 2.0

      # Routing contract.
      hard_coarse_route: false
      detach_coarse: true
      posterior_guided: true
      posterior_stable_reliability: true
      boundary_structured: true

      # No V1.7/V1.8 auxiliary routing losses or learned gate.
      # Reliability remains parameter-free and detached.

    # ----------------------------------------------------------
    # Weak semantic alignment inherited from V1.2+
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # Deliberately NOT introduced in the first V1.10.2 run
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   supervised start/end loss
    #   direct span-length target
    #   minimum-span constraint
    #   minimal-sufficient loss
    #   coarse-answer auxiliary loss
    #   trim target
    #   IoU / IoP optimization loss
    #   Refiner entropy loss
    #   Composer entropy loss
    #   Composer length/diversity/balance loss
    #   event-count forcing
    #   CRA -> Q-Bound handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #   differentiable all-span REFINE marginalization
    #
    # First-run goal:
    #   1) prevent the V1.10.1 learned Refiner correction from
    #      progressively overriding the BAPGR prior;
    #   2) raise RAW/prior expected-length ratio above the
    #      V1.10.1 collapse regime while preserving real refinement;
    #   3) increase semantic retention and RAW IoU without a large
    #      RAW IoP penalty;
    #   4) allow PSRC reliability to rise naturally only when RAW
    #      becomes genuinely useful;
    #   5) improve MAIN IoP / TIoP@0.5 / Acc&GQA while preserving
    #      MAIN IoU coverage.

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  #
  # CRAPipeline V1.10.2 adds only:
  #   + weak_align_weight * L_align
  #   + decomposition.loss_weight * L_decomp
  #
  # No new V1.10.2 routing/reliability/span-length loss.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including Composer and REFINE,
  # use the dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  # Same budget as V1.9 for a controlled comparison.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start V1.10.2 from scratch.
  # PPBR changes Refiner training dynamics, so resuming a
  # V1.10.1 checkpoint would not be a clean controlled experiment.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.10.2_seed2024
  info: "CRA testbed + Q-Bound V1.10.2 | dynamic latent decomposition + ordered event reasoning + latent contiguous event-span composition + BAPGR + prior-preserving bounded refinement (PPBR, cap=2.0) + posterior-stable reliability calibration (PSRC) + grounding"
  cuda: "0"
  seed: 2024
