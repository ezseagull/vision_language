# Q-BOUND V3.7 (PI-ERG): merged masked language pooling + event-relative grounding.
# R2-C fixed support graph, EQ-PTC, original CRA / L_ground / L_pair unchanged.
# Seed=2024, 15 epochs. Validation selects checkpoints; test runs and logs to WandB EACH epoch.
# feat_type=CLIPL refers to the existing CLIPL_I H5 key (TempCLIP-based pipeline).
# New Event Comparator: exhaustive contiguous candidates at T=32 (528 intervals).
# E15 weight transfer: set stat.init_from_checkpoint to the ACTUAL checkpoint path;
# leave null for a fresh-from-scratch V3.7 run. NEVER use stat.resume for E15 transfer.
dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null
  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL
model:
  name: CRA
  baseline: refine
  lan: RoBERTa
  lan_weight_path: roberta-base
  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265
  n_negs: 1
  prop_num: 1
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes:
  - 1
  - 3
  - 5
  time_penalty: null
  do: false
  vg_loss: 1
  vote: 0
  qbound:
    enabled: true
    version: 2.8.0
    require_question_only: true
    require_token_question: true
    detach_backbone_inputs: true
    hidden_dim: 256
    dropout: 0.3
    num_question_heads: 4
    question_ff_multiplier: 2
    grounding_loss:
      enabled: true
      loss_weight: 1.0
      temperature: 0.07
    predictive_loss:
      enabled: false
      loss_weight: 0.0
    support_graph_mode: fixed
    support_predictor_enabled: false
    pair_loss:
      enabled: true
      loss_weight: 0.1
      temperature: 0.07
      margin: 0.0
      gradient_audit_every: 200
    temporal_context_mode: eq_ptc
    eqptc_early_scale: 0.25
    eqptc_position_scale: 0.25
    eqptc_temporal_scale: 0.25
    # H2-04 fix: ignore PAD tokens when pooling global question/answer embeddings.
    language_pooling_mode: masked
    # H1 event-relative comparison; retains legacy Semantic Seed via residual fusion.
    event_grounding_mode: event_relative
    event_residual_scale: 0.10
    event_relation_temperature: 0.20
    event_candidate_max_length: null
optim:
  pipeline: cra
  optimizer: Adam
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5
  clip: 12
  lr: 1.0e-05
  weight_decay: 0
  amsgrad: true
  qbound_lr: 5.0e-05
  epochs: 15
  save_period: 1
  lr_scheduler: warmup
  step_size: 1
  stop_after_epoch: 15
stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099
  record_dir: ./output
  resume: null
  init_from_checkpoint: null  # replace null with the real EQ-PTC E15 path ONLY for weight transfer
  resume_strict: true
  resume_optimizer_strict: true
  save_val_predictions: true
  eval_test_each_epoch: true
  save_epoch_weights: false
misc:
  running_name: CRA/NextGQA/V3_7_PI_ERG_seed2024
  info: >-
    Q-Bound V3.7 PI-ERG: masked language pooling and Event-Relative Grounding
    (exhaustive interval candidate bank, comparator, residual Seed fusion).
    EQ-PTC early/position/temporal scales and R2-C fixed graph retained;
    CRA QA, L_ground, L_pair, Q1/Q2 sampler and 15-epoch optimization retained.
    Validation-only checkpoint selection; evaluate and log test on WandB every epoch
    for observation, never tune or select on test. init_from_checkpoint=null means
    fresh initialization; a real E15 checkpoint path warm-starts weights only,
    while Adam and LR schedule restart at epoch 1.
  cuda: '0'
  seed: 2024
