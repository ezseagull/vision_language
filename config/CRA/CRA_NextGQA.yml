# Q-Bound V2.1.0 — Query-Conditioned Latent Temporal Segment Composition
#
# Main path:
#   official frozen CLIP-L temporal features + question tokens
#       -> local temporal primitives (x, dx, d2x, relative time)
#       -> token-level visual-to-question interaction
#       -> primitive relevance u_t
#       -> adjacent relation/cohesion r_t
#       -> shared variable-scale segment energy E(s,e)
#       -> soft posterior P(s,e) and hard H* from the SAME energy
#
# Training:
#   L = L_CRA/main + lambda_A * L_answer_only
#
# answer_only is used only AFTER H(V,Q) is constructed. It never enters
# QBoundCore and is not required for grounding inference.
#
# Explicitly removed from V2.0:
#   cut field, cut-gated propagation, independent start/end heads,
#   functional KEEP/MERGE verifier, boundary-equilibrium objective.
#
# Temporal GT / IoU / IoP are never used as training supervision.
dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null
  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL
model:
  name: CRA
  baseline: refine
  lan: RoBERTa
  lan_weight_path: roberta-base
  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265
  n_negs: 1
  prop_num: 1
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes:
  - 1
  - 3
  - 5
  time_penalty: null
  do: false
  vg_loss: 1
  vote: 0
  qbound:
    enabled: true
    version: 2.1.0
    hidden_dim: 256
    require_question_only: true
    require_token_question: true
    detach_backbone_inputs: true
    dropout: 0.3
    use_generic_input_adapter: true
    input_adapter_dropout: 0.3
    num_question_heads: 4
    question_ff_multiplier: 2
    segment_temperature: 1.0
    relation_weight: 0.5
    boundary_weight: 0.25
    answer_only_supervision:
      loss_weight: 0.1
optim:
  pipeline: cra
  optimizer: Adam
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5
  clip: 12
  lr: 1.0e-05
  weight_decay: 0
  amsgrad: true
  qbound_lr: 5.0e-05
  epochs: 15
  save_period: 1
  lr_scheduler: warmup
  step_size: 1
stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099
  record_dir: ./output
  resume: null
misc:
  running_name: CRA/NextGQA/QBound_v2.1.0_latent_segment_seed2024
  info: CRA downstream testbed + Q-Bound V2.1.0 | official frozen CLIP-L local temporal
    features -> local primitive encoder (state + dx + d2x + relative time) -> token-level
    question interaction -> node relevance + adjacent relation -> shared variable-scale
    segment energy E(s,e) -> soft P(s,e) and hard H* from the same energy | answer-only
    candidate supervision lambda_A=0.10 after grounding only | no cut field | no independent
    start/end heads | no event-count target/cap | no functional KEEP/MERGE verifier
    | no boundary-equilibrium loss | no teacher distillation | no temporal GT/IoU/IoP
    training | answer-free grounding inference
  cuda: '0'
  seed: 2024
