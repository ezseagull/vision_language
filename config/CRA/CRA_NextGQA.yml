dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # Original CRA settings are kept unchanged for controlled
  # comparison with CRA / Q-Bound V1.4 / V1.5 / V1.6.
  #
  # IMPORTANT V1.7:
  #   window_sizes remains [1,3,5] ONLY for:
  #     (1) the original CRA grounding path, and
  #     (2) controlled fixed-window diagnostics.
  #
  #   The MAIN Q-Bound V1.7 pre-hoc span does NOT use this
  #   fixed-window search. It uses the frame-level refined
  #   start/end predicted inside ONE detached top-1 coarse event chain.
  #
  # causal_feature_path + do:true still belong to the downstream
  # CRA testbed. They are not inputs to Q-Bound DECOMPOSE,
  # RELATE, COMPOSE, or STABLE REFINE.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.7
  #
  #   DECOMPOSE -> RELATE -> COMPOSE -> STABLE REFINE -> GROUND
  #
  # V1.7 keeps the healthy V1.4/V1.5/V1.6 DECOMPOSE and Q-OEI
  # mechanisms and keeps the V1.5 Composer scorer unchanged.
  #
  # Main method change:
  #   * COMPOSE keeps a differentiable coarse answer branch;
  #   * REFINE receives only the detached hard top-1 coarse chain;
  #   * the all-span COMPOSE x REFINE marginalization from V1.6
  #     is removed from the MAIN path;
  #   * minimality is applied only when the refined answer remains
  #     sufficient relative to the coarse answer.
  # ============================================================
  qbound:
    enabled: true
    version: "1.7"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only.
    # Actual event count remains dynamically selected:
    #     1 <= M <= max_events
    max_events: 4

    # All Q-Bound temporal reasoning stages use question-only
    # semantics. Candidate-answer semantics must never define
    # topology, event chains, or refined boundaries.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Keep the same controlled setting as previous versions.
    # Q-Bound learns its own parameters while its raw video and
    # question inputs are detached from the upstream backbone.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    # Unchanged from V1.4/V1.5/V1.6 so the first V1.7 run isolates
    # the new COMPOSE->REFINE training/routing strategy.
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true

      # Outer objective:
      # total_loss += loss_weight * L_decomp
      loss_weight: 0.10

      # Internal partition-energy terms.
      # Deliberately unchanged.
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    # Scorer and temperature are intentionally unchanged from V1.5/V1.6.
    # For M ordered events, every valid contiguous chain [Ei ... Ej]
    # is considered; with max_events=4 there are at most 10 candidates.
    #
    # In V1.7:
    #   * composed_temporal_prob remains differentiable and is used by
    #     the explicit coarse VQA branch;
    #   * only the detached top-1 coarse chain is routed into REFINE.
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # STABLE REFINE: Minimal-Sufficient Frame Boundary Refiner
    # ----------------------------------------------------------
    # Given the detached selected coarse chain [Ei ... Ej]:
    #   start is searched only inside Ei,
    #   end   is searched only inside Ej,
    #   start <= end,
    #   refined interval must stay inside the coarse chain.
    #
    # Unlike V1.6, MAIN training does NOT marginalize over all
    # Composer spans. This prevents refined-task gradients from
    # encouraging the Composer to expand coarse support.
    refinement:
      enabled: true
      type: minimal_sufficient_boundary_refiner

      # Keep the V1.6 refiner temperature for the first controlled run.
      temperature: 0.30

      # Explicit routing contract for reproducibility/documentation.
      # The current code enforces these behaviors directly.
      hard_coarse_route: true
      detach_coarse: true

      # Keep the differentiable coarse Composer branch task-aware.
      #
      # total_loss += coarse_task_weight * L_coarse_VQA
      coarse_task_weight: 0.10

      # Minimal-sufficient objective:
      # minimize expected retained coarse-span fraction ONLY when
      # refined answer CE is no worse than coarse answer CE.
      #
      # total_loss += minimal_sufficient_weight * L_MS
      minimal_sufficient_weight: 0.10

      # Sufficient iff:
      #   CE_refined <= CE_coarse + sufficiency_margin
      #
      # First controlled run uses the strict comparison.
      sufficiency_margin: 0.0

    # ----------------------------------------------------------
    # Weak semantic alignment inherited from V1.2+
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # Deliberately NOT introduced in the first V1.7 run
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   supervised start/end loss
    #   direct span-length target
    #   trim target
    #   IoU / IoP optimization loss
    #   refiner entropy loss
    #   Composer entropy loss
    #   Composer length/diversity/balance loss
    #   event-count forcing
    #   CRA -> Q-Bound handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #
    # Goal:
    # preserve the coverage/IoU gain of COMPOSE while improving
    # temporal precision (IoP/GQA) through stable coarse routing
    # and answer-conditioned minimal-sufficient refinement.

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  #
  # CRAPipeline V1.7 adds:
  #   + weak_align_weight * L_align
  #   + decomposition.loss_weight * L_decomp
  #   + refinement.coarse_task_weight * L_coarse_VQA
  #   + refinement.minimal_sufficient_weight * L_MS
  #
  # L_MS uses NO temporal GT.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including Composer and REFINE,
  # use the dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  # Keep the same training budget for controlled comparison.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start V1.7 from scratch.
  # V1.7 changes gradient routing and the objective, so resuming V1.6
  # would not be a controlled experiment.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.7_seed2024
  info: "CRA testbed + Q-Bound V1.7 | dynamic latent decomposition + ordered event reasoning + differentiable coarse event-span composition + detached hard coarse routing + minimal-sufficient frame-level refinement + grounding"
  cuda: "0"
  seed: 2024
