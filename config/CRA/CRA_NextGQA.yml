dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # ------------------------------------------------------------
  # CRA remains only the downstream VideoQA testbed/consumer.
  #
  # V1.11-A controlled change:
  #   * VisualIntervention remains OFF, following the V1.10.3 ablation.
  #   * CRA still keeps its own VideoEmbedding and downstream x_bar.
  #   * Q-Bound no longer consumes CRA.VideoEmbedding output.
  #   * Q-Bound receives the sampled raw CLIP-L feature tensor directly
  #     and applies its own trainable generic input adapter.
  #
  # window_sizes remains [1,3,5] only for the original CRA path and
  # controlled grounding/readout diagnostics. The official Q-Bound MAIN
  # interval is still produced by COMPOSE + BAPGR + PPBR + PSRC.
  # ------------------------------------------------------------
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  # V1.10.3 showed no material loss from disabling CRA VisualIntervention
  # and healthier Q-Bound internal dynamics, so keep it OFF in V1.11.
  do: false

  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.11-B — GENERIC INPUT + COUNTERFACTUAL EVIDENCE VALIDATION
  #
  # Data route:
  #
  #   sampled raw CLIP-L [B,T,768]
  #          |                         |
  #          |                         +--> CRA.VideoEmbedding --> CRA consumer
  #          |
  #          +--> Q-Bound-owned generic input adapter
  #                    |
  #                    v
  #              DECOMPOSE -> RELATE -> COMPOSE
  #                    -> detached Composer posterior
  #                    -> BAPGR
  #                    -> PPBR
  #                    -> PSRC
  #                    -> GROUND
  #
  # V1.11-B keeps the V1.11-A generic-input route unchanged:
  #
  #   raw CLIP-L -> Q-Bound-owned generic adapter -> Q-Bound
  #
  # and adds counterfactual evidence validation on the calibrated MAIN
  # temporal support:
  #
  #   X_suff = keep * X + remove * X_donor
  #   X_nec  = remove * X + keep * X_donor
  #
  # where the donor is a deterministic in-batch cyclic sample.
  #
  # CRA remains the downstream answer consumer/testbed. The CF path uses
  # detached CRA features, detached MAIN pooling weights, frozen CRA
  # projection weights, and detached answer candidates so the added loss
  # supervises Q-Bound temporal evidence rather than adapting the consumer.
  #
  # The generic adapter is owned by QBoundCore and is initialized close
  # to the raw feature geometry (identity-initialized projection), then:
  #
  #     Linear(768->768)
  #       -> GELU
  #       -> LayerNorm
  #       -> fixed sinusoidal positional encoding
  #       -> Dropout
  #
  # V1.11-A preserves V1.10.3 temporal mechanisms unchanged:
  #   * dynamic DECOMPOSE
  #   * Q-OEI RELATE
  #   * latent contiguous COMPOSE
  #   * BAPGR boundary geometry
  #   * detached Composer -> Refiner routing
  #   * PPBR cap = 2.0
  #   * PSRC reliability calibration
  #   * no CRA temporal prior/handover
  #   * no direct event-token answer residual
  #
  # Training objective becomes:
  #
  #   L = L_CRA/main
  #       + 0.10 L_align
  #       + 0.10 L_decomp
  #       + 0.05 L_sufficiency
  #       + 0.05 L_necessity
  #
  # Sufficiency requires the evidence-preserved branch to retain the correct
  # answer. Necessity requires removing selected evidence to reduce the
  # correct-answer logit by a margin of 0.20. Necessity is applied only to
  # samples whose factual MAIN prediction is already correct.
  #
  # The V1.11-B counterfactual support uses a mass-preserving gradient view:
  # forward support is identical to V1.11-A, while the CF loss cannot win by
  # globally expanding the support toward the full video.
  #
  # No temporal GT, IoU/IoP loss, duration target, minimum-span rule,
  # minimality/sparsity loss, event-count forcing, or learned reliability
  # gate is introduced.
  # ============================================================
  qbound:
    enabled: true
    version: "1.11"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Computational upper bound only; event count remains dynamic.
    max_events: 4

    # Q-Bound topology/reasoning uses question-only semantics.
    require_question_only: true

    # CRA temporal key/prior is not consumed by Q-Bound.
    use_temporal_prior: false

    # Raw CLIP-L/question features are detached from external encoders via
    # this route; Q-Bound's own adapter/core parameters remain trainable.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # V1.11-B: Q-Bound-owned generic visual input adapter
    # ----------------------------------------------------------
    use_generic_input_adapter: true

    # Keep equal to Q-Bound dropout for the first controlled run.
    input_adapter_dropout: 0.3

    # Preserve explicit temporal order without using CRA.VideoEmbedding.
    input_adapter_use_position: true

    # ON in V1.11-B. QBoundCore exposes a mass-preserving differentiable
    # MAIN keep/remove support for answer-level counterfactual supervision.
    counterfactual_evidence_interface: true

    # ----------------------------------------------------------
    # V1.11-B: counterfactual evidence validation
    # ----------------------------------------------------------
    counterfactual:
      training_enabled: true

      # First controlled run: keep both terms intentionally small so the
      # factual VQA/alignment/decomposition objectives remain dominant.
      sufficiency_weight: 0.05
      necessity_weight: 0.05

      # Require the factual correct-answer logit to exceed the
      # evidence-removed correct-answer logit by at least this margin.
      necessity_margin: 0.20

      # Avoid reinforcing evidence for an already-wrong factual answer,
      # especially in early epochs.
      necessity_correct_only: true

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    proposal_candidates: 6
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true
      loss_weight: 0.10
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # COMPOSE: Latent Contiguous Event-Span Composer
    # ----------------------------------------------------------
    composer:
      enabled: true
      type: latent_contiguous_event_span
      temperature: 0.35

    # ----------------------------------------------------------
    # REFINE:
    # BAPGR + PPBR + PSRC
    # ----------------------------------------------------------
    refinement:
      enabled: true
      type: prior_preserving_bounded_refiner

      # Unchanged from V1.10.2/V1.10.3.
      temperature: 0.30
      boundary_anchor_power: 2.0
      correction_cap: 2.0

      # Routing contract.
      hard_coarse_route: false
      detach_coarse: true
      posterior_guided: true
      posterior_stable_reliability: true
      boundary_structured: true

    # ----------------------------------------------------------
    # Weak question/event semantic alignment
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # V1.11-B controlled exclusions
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   supervised start/end loss
    #   direct span-length target
    #   minimum-span constraint
    #   minimal-sufficient / sparsity loss
    #   coarse-answer auxiliary loss
    #   trim target
    #   IoU / IoP optimization loss
    #   Refiner entropy loss
    #   Composer entropy/diversity/balance loss
    #   event-count forcing
    #   CRA -> Q-Bound temporal handover
    #   direct reasoned-event -> answer residual
    #   CRA consistency loss
    #   differentiable all-span REFINE marginalization
    #
    # First-run goals:
    #   1) preserve the V1.11-A generic-input independence result;
    #   2) make selected temporal evidence answer-faithful rather than merely
    #      confident, using sufficiency + necessity supervision;
    #   3) improve/retain mIoP, mIoU, TIoP@0.5 and Acc&GQA without introducing
    #      span-length/minimality supervision;
    #   4) verify sufficiency confidence stays close to factual confidence
    #      while evidence-removed confidence decreases;
    #   5) check that semantic retention/reliability improve without restoring
    #      Refiner over-trimming or full-video support expansion;
    #   6) keep the experiment controlled before V1.12 generic output/event
    #      adapter work.

optim:
  pipeline: cra
  optimizer: Adam

  # Preserve the V1.11-A factual objective; V1.11-B adds CF terms in pipeline.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including the new generic input adapter,
  # Composer and Refiner, should use this dedicated Q-Bound optimizer group.
  qbound_lr: 5.e-5

  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start the first V1.11-B run from scratch for the cleanest A->B
  # comparison. Do not resume from V1.11-A unless intentionally running a
  # separate fine-tuning ablation.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.11B_counterfactual_evidence_seed2024
  info: "CRA downstream testbed + Q-Bound V1.11-B | raw CLIP-L -> Q-Bound-owned generic input adapter | VisualIntervention OFF | dynamic DECOMPOSE + Q-OEI + COMPOSE + BAPGR + PPBR(cap=2.0) + PSRC | mass-preserving counterfactual evidence validation | lambda_suf=0.05 | lambda_nec=0.05 | necessity_margin=0.20 | necessity_correct_only=true"
  cuda: "0"
  seed: 2024
