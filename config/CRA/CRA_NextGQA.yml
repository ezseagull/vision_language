dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # Keep original CRA grounding settings unchanged for fair comparison.
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ------------------------------------------------------------
  # Q-Bound V1.3
  # Dynamic topology + weak alignment + ordered event reasoning
  # ------------------------------------------------------------
  qbound:
    enabled: true
    version: "1.3"

    # ----------------------------------------------------------
    # Core size / generic interface
    # ----------------------------------------------------------
    hidden_dim: 256

    # Maximum event slots only; event count remains dynamically selected.
    max_events: 4

    # Event discovery/reasoning is conditioned on question-only semantics.
    require_question_only: true

    # CRA temporal grounding is not consumed by Q-Bound topology.
    use_temporal_prior: false

    # Controlled comparison with V1.2:
    # keep CRA/video backbone detached from the Q-Bound branch.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Dynamic boundary discovery
    # KEEP IDENTICAL TO THE SUCCESSFUL V1.2 RUN.
    # ----------------------------------------------------------
    boundary_temperature: 0.7
    assignment_temperature: 0.5
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # V1.3 ordered multi-event reasoning
    # ----------------------------------------------------------
    # Q-OEI itself is intentionally lightweight and configured in core.py.
    # This fixed adapter residual scale controls only how strongly the
    # reasoned event representation enters the CRA answer space.
    #
    # It is NOT learnable, preventing an easy alpha -> 0 bypass.
    # The effective training contribution is also multiplied by qbound_mix,
    # and the adapter starts with small weights, so scale=1.0 is conservative.
    reasoning_residual_scale: 1.0

    # ----------------------------------------------------------
    # Weak event alignment inherited from V1.2
    # ----------------------------------------------------------
    # Keep unchanged: V1.2 showed that this objective learns successfully.
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # Keep disabled. V1.2 already achieved dynamic event-count distributions;
    # adding sparsity now could push the topology toward one-event collapse.
    boundary_sparse_weight: 0.0

    # ----------------------------------------------------------
    # Deterministic CRA -> Q-Bound temporal handover
    # ----------------------------------------------------------
    # Keep identical to V1.2 for a controlled comparison.
    # Training: 0.2 -> 1.0 over 5 epochs.
    # Validation/test: pipeline forces qbound_mix = 1.0.
    handover_start: 0.2
    handover_epochs: 5

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives remain unchanged.
  # Weak Q-Bound alignment is added separately in CRAPipeline.
  # V1.3 ordered reasoning gets NO extra auxiliary loss:
  # it must prove useful through the main VQA/alignment path.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # Includes all parameters whose names contain "qbound", including:
  # qbound core, Q-OEI modules, and qbound_reasoning_adapter.
  qbound_lr: 5.e-5

  # Exploratory diagnostic budget kept equal to V1.2.
  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # Start V1.3 from scratch for a clean architectural comparison.
  # Do not resume the V1.2 checkpoint because Q-OEI and the reasoning adapter
  # introduce new parameters and alter the answer representation.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.3_seed2024
  info: "CRA + Q-Bound V1.3 | dynamic events + weak alignment + ordered multi-event reasoning"
  cuda: "0"
  seed: 2024
