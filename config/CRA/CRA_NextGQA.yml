dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  # CRA is only the downstream VideoQA consumer/testbed.
  # Q-Bound V1.12 receives sampled raw CLIP-L tokens through its own adapter.
  # The CRA temporal key is retained only for diagnostics and is never used as
  # a Q-Bound temporal prior/handover signal.
  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  # Keep CRA VisualIntervention OFF. V1.12 does not use it in either the
  # question-only grounding student or the privileged answer-aware critic.
  do: false

  vg_loss: 1
  vote: 0

  # ============================================================
  # Q-Bound V1.12 — EVENT-GUIDED TEMPORAL HYPOTHESIS COMPETITION
  #                  + PRIVILEGED ANSWER-AWARE DISTILLATION
  #
  # Main grounding path (train and inference):
  #
  #   raw CLIP-L + question
  #          ↓
  #   Q-Bound generic input adapter
  #          ↓
  #   dynamic DECOMPOSE (K_i varies per sample)
  #          ↓
  #   Q-OEI RELATE
  #          ↓
  #   frame-exact contiguous hypothesis bank
  #          ↓
  #   question-only hypothesis scorer p_theta(H | V,Q)
  #          ↓
  #   hard winning hypothesis H*
  #          ↓
  #   exact temporal grounding
  #
  # For T=32, the exact hypothesis bank contains T(T+1)/2 = 528 intervals.
  # Dynamic events provide semantic structure but DO NOT constrain the final
  # start/end to event boundaries.
  #
  # Training-only privileged critic:
  #
  #   candidate answers + GT answer
  #             ↓
  #   stop-gradient CRA answer-aware critic
  #             ↓
  #   utility over H / trim / expand / complement
  #             ↓
  #   detached teacher distribution q(H)
  #             ↓
  #   KL(q || p_theta)
  #
  # Answers are NEVER inputs to QBoundCore and are NOT required to generate
  # grounding at inference. This preserves answer-free grounding while using
  # answer semantics as privileged supervision during training.
  #
  # V1.12 deliberately removes the V1.11 main-path machinery:
  #   * latent COMPOSE as final selector
  #   * BAPGR
  #   * PPBR
  #   * PSRC reliability calibration
  #   * cross-video donor counterfactuals
  #   * minimality / target-duration supervision
  #   * CRA -> Q-Bound temporal handover
  #   * direct event-token answer residual
  # ============================================================
  qbound:
    enabled: true
    version: "1.12"

    # ----------------------------------------------------------
    # Generic Q-Bound interface / capacity
    # ----------------------------------------------------------
    hidden_dim: 256

    # Capacity ceiling only. The selected event count K_i remains dynamic.
    # We start with K_max=6; proposal_candidates=8 gives enough candidate
    # change points to represent every event count up to this capacity.
    max_events: 6
    proposal_candidates: 8

    # Q-Bound temporal reasoning/scoring uses question-only semantics.
    require_question_only: true

    # No CRA temporal prior enters Q-Bound.
    use_temporal_prior: false

    # External visual/language encoders do not receive gradient through the
    # Q-Bound route. Q-Bound's own adapter/core remain trainable.
    detach_backbone_inputs: true

    dropout: 0.3

    # ----------------------------------------------------------
    # Q-Bound-owned generic visual input adapter
    # ----------------------------------------------------------
    use_generic_input_adapter: true
    input_adapter_dropout: 0.3
    input_adapter_use_position: true

    # ----------------------------------------------------------
    # Question-conditioned temporal geometry retained from V1.4+
    # ----------------------------------------------------------
    question_modulation_scale: 0.10

    # ----------------------------------------------------------
    # DECOMPOSE: dynamic boundary proposals
    # ----------------------------------------------------------
    boundary_temperature: 0.7
    boundary_threshold: 0.5
    boundary_radius: 2
    boundary_bias_init: -0.5
    min_event_mass: 0.25

    # ----------------------------------------------------------
    # DECOMPOSE: latent partition objective
    # ----------------------------------------------------------
    decomposition:
      enabled: true
      loss_weight: 0.10
      complexity_weight: 1.25
      boundary_weight: 0.50
      temperature: 0.20

    # ----------------------------------------------------------
    # RELATE: Question-Conditioned Ordered Event Interaction
    # ----------------------------------------------------------
    reasoning:
      enabled: true
      type: ordered_event_interaction

    # ----------------------------------------------------------
    # V1.12 privileged answer-aware hypothesis teacher
    # ----------------------------------------------------------
    hypothesis_teacher:
      enabled: true

      # Single new supervision weight. Teacher utility internally uses fixed,
      # equal contributions from sufficiency, trim, expand and complement.
      loss_weight: 0.10

      # Train ranking only when the full-video privileged critic predicts the
      # GT answer correctly, avoiding unreliable temporal ordering targets.
      correct_only: true

    # ----------------------------------------------------------
    # Weak question/event semantic alignment retained
    # ----------------------------------------------------------
    weak_align_weight: 0.10
    weak_align_temperature: 0.07

    # ----------------------------------------------------------
    # V1.12 controlled exclusions
    # ----------------------------------------------------------
    # No:
    #   temporal-GT supervision
    #   supervised start/end loss
    #   IoU / IoP optimization loss
    #   fixed event-count target
    #   target duration / minimum-span rule
    #   minimality / sparsity loss
    #   Composer/Refiner entropy regularization
    #   BAPGR / PPBR / PSRC
    #   cross-video donor counterfactual
    #   CRA -> Q-Bound temporal handover
    #   direct reasoned-event -> answer residual
    #   answer feature input to QBoundCore
    #   answer requirement at grounding inference

optim:
  pipeline: cra
  optimizer: Adam

  # Main CRA task remains unchanged. V1.12 adds weak alignment,
  # decomposition and listwise hypothesis-distillation losses in the pipeline.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # All decoder.qbound.* parameters, including the generic input adapter,
  # dynamic DECOMPOSE/Q-OEI and hypothesis scorer, use this optimizer group.
  qbound_lr: 5.e-5

  epochs: 15
  save_period: 1

  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 15
    vis: false
    display_port: 8099

  record_dir: ./output

  # V1.12 is a structural redesign. Train from scratch; do not resume V1.11.
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.12_hypothesis_competition_seed2024
  info: "CRA downstream testbed + Q-Bound V1.12 | raw CLIP-L -> Q-Bound generic adapter | VisualIntervention OFF | dynamic DECOMPOSE K<=6 + Q-OEI | exact 528 frame-level temporal hypotheses for T=32 | question-only student hypothesis scorer | stop-gradient privileged answer-aware critic | sufficiency + trim + expand + complement utility | listwise KL distillation lambda_rank=0.10 | answer-free grounding inference"
  cuda: "0"
  seed: 2024
