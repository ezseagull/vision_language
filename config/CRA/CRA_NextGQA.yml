dataset:
  name: nextgqa
  csv_path: /content/data/nextgqa
  features_path: /content/data/nextqa/video_feature/CLIPL
  causal_feature_path: /content/data/nextgqa/causal_feature
  vocab_path: null

  batch_size: 64
  num_thread_reader: 4
  qmax_words: 30
  amax_words: 38
  max_feats: 32
  mc: 5
  a2id: null
  feat_type: CLIPL

model:
  name: CRA
  baseline: refine

  lan: RoBERTa
  lan_weight_path: roberta-base

  feature_dim: 768
  word_dim: 768
  d_model: 768
  d_ff: 768
  num_layers: 2
  num_heads: 8
  dropout: 0.3
  vocab_size: 50265

  n_negs: 1
  prop_num: 1

  sigma: 3.0
  gamma: 1
  lamb: 0.15
  window_sizes: [1, 3, 5]
  time_penalty: null

  do: true
  vg_loss: 1
  vote: 0

  # ------------------------------------------------------------
  # Q-Bound V1.1.3
  # ------------------------------------------------------------
  qbound:
    enabled: true
    version: "1.1.3"

    hidden_dim: 256
    max_events: 4

    # Q-Bound topology must not consume CRA temporal grounding.
    # refine_v113.py also passes temporal_prior=None defensively.
    use_temporal_prior: false

    # First controlled V1.1.3 run:
    # Q-Bound learns its own parameters while the shared CRA backbone
    # is protected from topology gradients. This can be ablated later.
    detach_backbone_inputs: true

    # Explicit topology settings for reproducibility.
    boundary_temperature: 0.7
    assignment_temperature: 0.35
    boundary_bias_init: -2.0
    min_event_mass: 0.25

    # Deterministic CRA -> Q-Bound temporal handover.
    # Training: lambda goes linearly from 0.2 to 1.0 over 5 epochs.
    # Validation/test: pipeline always forces lambda = 1.0.
    handover_start: 0.2
    handover_epochs: 5

optim:
  pipeline: cra
  optimizer: Adam

  # Original CRA objectives only.
  # V1.1.3 has NO Q-Bound auxiliary loss.
  loss:
    ce:
      vq: 1
      vqa: 1
    align:
      g: 0.5

  clip: 12
  lr: 1.e-5
  weight_decay: 0
  amsgrad: true

  # Dedicated Q-Bound optimizer group created by BasePipeline.
  qbound_lr: 5.e-5

  epochs: 30
  save_period: 1
  lr_scheduler: warmup
  step_size: 1

stat:
  monitor:
    mode: max
    metric: acc
    early_stop: 30
    vis: false
    display_port: 8099

  record_dir: ./output
  resume: null

misc:
  running_name: CRA/NextGQA/QBound_v1.1.3_seed2024
  info: "CRA + Q-Bound V1.1.3"
  cuda: "0"
  seed: 2024
